# Synchronisation automatique toutes les 15 minutes (complément au cron Vercel quotidien, limité sur le forfait Hobby).
# Inactif tant que les secrets IMMOPILOT_URL et CRON_SECRET ne sont pas définis dans le dépôt
# (Settings → Secrets and variables → Actions).
name: Synchronisation ImmoPilot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Déclencher la synchronisation
        env:
          URL: ${{ secrets.IMMOPILOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets non configurés : rien à faire."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$URL/api/sync?action=cron"
